name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          AF08FD: ${{ secrets.AF08FD }}
          B377E2: ${{ secrets.B377E2 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('AF08FD', '')
          tag_b = os.environ.get('B377E2', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 3c4c31930c96ab8a4aeffd7feedc75e6f5 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 2e5b825d0c3b3341555eb8c64bffad5f87008b -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
